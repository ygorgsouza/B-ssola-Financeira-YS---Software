```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola Financeira YS — Entrar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message,
    #recoveryMessage {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .forgot:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- LOGIN NORMAL -->
  <div class="login-box" id="loginBox">

    <h1>Bússola Financeira YS</h1>

    <div class="subtitle">
      Entre na sua conta
    </div>

    <form id="loginForm">

      <label for="email">E-mail</label>

      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        required
      >

      <label for="password">Palavra-passe</label>

      <input
        type="password"
        id="password"
        placeholder="Sua palavra-passe"
        required
      >

      <button type="submit" id="loginButton">
        Entrar
      </button>

    </form>

    <a href="#" class="forgot" id="forgotPassword">
      Esqueci a minha palavra-passe
    </a>

    <div id="message"></div>

  </div>


  <!-- CRIAÇÃO DA PRIMEIRA PALAVRA-PASSE -->
  <div class="login-box" id="recoveryBox" style="display:none;">

    <h1>Bússola Financeira YS</h1>

    <div class="subtitle">
      A sua compra foi confirmada.<br>
      Crie agora a sua palavra-passe para acessar a sua conta.
    </div>

    <form id="recoveryForm">

      <label for="newPassword">
        Criar palavra-passe
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirmar palavra-passe
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Repita a sua palavra-passe"
        minlength="6"
        required
      >

      <button type="submit" id="recoveryButton">
        Criar minha palavra-passe
      </button>

    </form>

    <div id="recoveryMessage"></div>

  </div>


<script>

  // --------------------------------------------------
  // SUPABASE
  // --------------------------------------------------

  const SUPABASE_URL =
    "https://acjbjocmwukmtocxudwg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bGaSjpWnKibqowcO1LWTaA_lEKRwx4U";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // --------------------------------------------------
  // ELEMENTOS
  // --------------------------------------------------

  const loginBox =
    document.getElementById("loginBox");

  const recoveryBox =
    document.getElementById("recoveryBox");

  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const recoveryForm =
    document.getElementById("recoveryForm");

  const recoveryButton =
    document.getElementById("recoveryButton");

  const recoveryMessage =
    document.getElementById("recoveryMessage");


  // --------------------------------------------------
  // MOSTRAR TELA DE CRIAÇÃO DE SENHA
  // --------------------------------------------------

  function showRecoveryScreen() {

    loginBox.style.display = "none";

    recoveryBox.style.display = "block";

  }


  // --------------------------------------------------
  // VERIFICAR SE A URL É DE RECOVERY
  // --------------------------------------------------

  function isRecoveryUrl() {

    const hash =
      window.location.hash
        ? window.location.hash.substring(1)
        : "";

    const hashParams =
      new URLSearchParams(hash);

    const queryParams =
      new URLSearchParams(
        window.location.search
      );

    return (
      hashParams.get("type") === "recovery" ||
      queryParams.get("type") === "recovery"
    );

  }


  // --------------------------------------------------
  // DETECÇÃO IMEDIATA
  // --------------------------------------------------

  const recoveryUrl =
    isRecoveryUrl();

  if (recoveryUrl) {

    showRecoveryScreen();

  }


  // --------------------------------------------------
  // MONITORAR AUTENTICAÇÃO
  // --------------------------------------------------

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      console.log(
        "AUTH EVENT:",
        event
      );

      // Quando o Supabase confirma que o link
      // é de recuperação de senha.
      if (
        event === "PASSWORD_RECOVERY"
      ) {

        showRecoveryScreen();

        return;

      }

      // IMPORTANTE:
      // Durante recovery não redirecionar
      // automaticamente para o dashboard.
      if (recoveryUrl) {

        return;

      }

    }
  );


  // --------------------------------------------------
  // LOGIN NORMAL
  // --------------------------------------------------

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      button.disabled = true;

      button.textContent =
        "A entrar...";

      message.textContent = "";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });


      if (error) {

        console.error(
          "Erro no login:",
          error
        );

        message.textContent =
          "E-mail ou palavra-passe incorretos.";

        button.disabled = false;

        button.textContent =
          "Entrar";

        return;

      }


      console.log(
        "Login realizado:",
        data.user?.email
      );


      // Login normal:
      // segue para a aplicação.
      window.location.href = "/";

    }
  );


  // --------------------------------------------------
  // ESQUECI A PALAVRA-PASSE
  // --------------------------------------------------

  document
    .getElementById("forgotPassword")
    .addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          message.textContent =
            "Digite o seu e-mail primeiro.";

          return;

        }


        const {
          error
        } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/login.html"
              }
            );


        if (error) {

          console.error(
            "Erro ao enviar recuperação:",
            error
          );

          message.textContent =
            "Não foi possível enviar o e-mail. Tente novamente.";

          return;

        }


        message.textContent =
          "Enviámos um e-mail para criar uma nova palavra-passe.";

      }
    );


  // --------------------------------------------------
  // CRIAR / ALTERAR PALAVRA-PASSE
  // --------------------------------------------------

  recoveryForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const newPassword =
        document
          .getElementById("newPassword")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      recoveryMessage.textContent =
        "";


      // --------------------------------------------------
      // VALIDAR TAMANHO
      // --------------------------------------------------

      if (newPassword.length < 6) {

        recoveryMessage.textContent =
          "A palavra-passe deve ter pelo menos 6 caracteres.";

        return;

      }


      // --------------------------------------------------
      // CONFIRMAR SENHAS
      // --------------------------------------------------

      if (
        newPassword !==
        confirmPassword
      ) {

        recoveryMessage.textContent =
          "As palavras-passe não coincidem.";

        return;

      }


      recoveryButton.disabled =
        true;

      recoveryButton.textContent =
        "A criar palavra-passe...";


      // --------------------------------------------------
      // ATUALIZAR SENHA NO SUPABASE
      // --------------------------------------------------

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password:
              newPassword
          });


      if (error) {

        console.error(
          "Erro ao criar palavra-passe:",
          error
        );

        recoveryMessage.textContent =
          "Não foi possível criar a palavra-passe. O link pode ter expirado. Solicite um novo e-mail.";

        recoveryButton.disabled =
          false;

        recoveryButton.textContent =
          "Criar minha palavra-passe";

        return;

      }


      console.log(
        "PALAVRA-PASSE CRIADA COM SUCESSO"
      );


      recoveryMessage.textContent =
        "Palavra-passe criada com sucesso! A entrar na sua conta...";


      // --------------------------------------------------
      // IR PARA O DASHBOARD
      // --------------------------------------------------

      setTimeout(
        () => {

          window.location.href =
            "/";

        },
        1200
      );

    }
  );

</script>

</body>
</html>
```
