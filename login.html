<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola Financeira YS — Entrar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Bússola Financeira YS</h1>

    <div class="subtitle">
      Entre na sua conta
    </div>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        required
      >

      <label for="password">Palavra-passe</label>
      <input
        type="password"
        id="password"
        placeholder="Sua palavra-passe"
        required
      >

      <button type="submit" id="loginButton">
        Entrar
      </button>

    </form>

    <a href="#" class="forgot" id="forgotPassword">
      Esqueci a minha palavra-passe
    </a>

    <div id="message"></div>
  </div>

<script>
  const SUPABASE_URL = "https://acjbjocmwukmtocxudwg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bGaSjpWnKibqowcO1LWTaA_lEKRwx4U";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "A entrar...";
    message.textContent = "";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = "Entrar";
      return;
    }

    window.location.href = "/";
  });

  document.getElementById("forgotPassword").addEventListener("click", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
      message.textContent = "Digite o seu e-mail primeiro.";
      return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/login.html"
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent = "Enviámos um e-mail para redefinir a sua palavra-passe.";
  });
</script>

</body>
</html>
