<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bússola Financeira YS — Entrar</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    #recoveryMessage {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">
    <h1>Bússola Financeira YS</h1>

    <div class="subtitle">
      Entre na sua conta
    </div>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        required
      >

      <label for="password">Palavra-passe</label>
      <input
        type="password"
        id="password"
        placeholder="Sua palavra-passe"
        required
      >

      <button type="submit" id="loginButton">
        Entrar
      </button>

    </form>

    <a href="#" class="forgot" id="forgotPassword">
      Esqueci a minha palavra-passe
    </a>

    <div id="message"></div>
  </div>

  <!-- Ecrã de definição de nova senha, mostrado apenas quando o utilizador chega
       através do link de recuperação de senha do Supabase (type=recovery). -->
  <div class="login-box" id="recoveryBox" style="display:none;">
    <h1>Bússola Financeira YS</h1>

    <div class="subtitle">
      Defina a sua nova palavra-passe
    </div>

    <form id="recoveryForm">

      <label for="newPassword">Nova palavra-passe</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirmar nova palavra-passe</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Repita a nova palavra-passe"
        minlength="6"
        required
      >

      <button type="submit" id="recoveryButton">
        Guardar nova palavra-passe
      </button>

    </form>

    <div id="recoveryMessage"></div>
  </div>

<script>
  const SUPABASE_URL = "https://acjbjocmwukmtocxudwg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bGaSjpWnKibqowcO1LWTaA_lEKRwx4U";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginBox = document.getElementById("loginBox");
  const recoveryBox = document.getElementById("recoveryBox");

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  const recoveryForm = document.getElementById("recoveryForm");
  const recoveryButton = document.getElementById("recoveryButton");
  const recoveryMessage = document.getElementById("recoveryMessage");

  // Mostra o ecrã de "definir nova senha" e esconde o login normal.
  function showRecoveryScreen() {
    loginBox.style.display = "none";
    recoveryBox.style.display = "block";
  }

  // Deteção imediata pela URL (evita o "flash" do formulário de login
  // enquanto o Supabase ainda está a processar o token em segundo plano).
  // O Supabase pode devolver o parâmetro type=recovery tanto na hash
  // (#access_token=...&type=recovery) como na query (?type=recovery&code=...),
  // dependendo do fluxo, por isso verificamos os dois.
  (function checkRecoveryInUrl() {
    const hash = window.location.hash ? window.location.hash.substring(1) : "";
    const hashParams = new URLSearchParams(hash);
    const queryParams = new URLSearchParams(window.location.search);

    if (hashParams.get("type") === "recovery" || queryParams.get("type") === "recovery") {
      showRecoveryScreen();
    }
  })();

  // Confirmação "oficial" do Supabase: quando o token de recuperação da URL
  // é processado, o cliente cria uma sessão e dispara o evento PASSWORD_RECOVERY.
  // É só a partir daqui que updateUser({ password }) pode ser chamado com sucesso.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      showRecoveryScreen();
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "A entrar...";
    message.textContent = "";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = "Entrar";
      return;
    }

    window.location.href = "/";
  });

  document.getElementById("forgotPassword").addEventListener("click", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
      message.textContent = "Digite o seu e-mail primeiro.";
      return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/login.html"
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent = "Enviámos um e-mail para redefinir a sua palavra-passe.";
  });

  recoveryForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    recoveryMessage.textContent = "";

    if (newPassword.length < 6) {
      recoveryMessage.textContent = "A nova palavra-passe deve ter pelo menos 6 caracteres.";
      return;
    }

    if (newPassword !== confirmPassword) {
      recoveryMessage.textContent = "As palavras-passe não coincidem.";
      return;
    }

    recoveryButton.disabled = true;
    recoveryButton.textContent = "A guardar...";

    const { error } = await supabaseClient.auth.updateUser({
      password: newPassword
    });

    if (error) {
      recoveryMessage.textContent = error.message;
      recoveryButton.disabled = false;
      recoveryButton.textContent = "Guardar nova palavra-passe";
      return;
    }

    recoveryMessage.textContent = "Palavra-passe atualizada com sucesso! A entrar...";

    // Depois de definir a nova senha, a sessão de recovery já está ativa,
    // por isso seguimos direto para a aplicação, onde a verificação normal
    // de access_active (no index.html) continua a acontecer como sempre.
    setTimeout(() => {
      window.location.href = "/";
    }, 1200);
  });
</script>

</body>
</html>
